---
name: Continuous integration

on:
  pull_request:
    types: [ assigned, opened, reopened, synchronize, ready_for_review ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - run: uv run --frozen make test

      - name: Start the web API
        run: make serve-local &

      - name: Test the Web API responds
        run: curl --retry-connrefused --retry 10 --retry-delay 2 --fail --silent --show-error 'http://127.0.0.1:5000/spec'

      - name: Test the Web API responds with a proper message
        run: curl --retry-connrefused --retry 10 --retry-delay 2 --fail --silent --show-error 'http://127.0.0.1:5000' | grep 'OpenFisca Web API'
      - run: uv run --frozen pre-commit run --all-files

      - name: Check version number has been properly updated
        run: "${GITHUB_WORKSPACE}/.github/is-version-number-acceptable.sh"

      - run: uv build

      - name: Test the built package
        run: uv run --frozen twine check dist/*
